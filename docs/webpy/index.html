<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSV Python Playground | TU Ilmenau (EMS)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  
  <!-- Pyodide WASM -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

  <style>
    :root {
      --bg-dark: #1b2729;
      --bg-header: #23373B;
      --bg-surface: #2b3e42;
      --bg-editor: #282a36;
      --accent: #FF5D00;
      --accent-hover: #ff7524;
      --text-main: #f0f4f5;
      --text-sub: #b2c2c5;
      --border-color: #3b5055;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--accent);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-title span {
      color: var(--accent);
    }

    .logo-badge {
      font-size: 0.72rem;
      background: var(--bg-surface);
      color: var(--text-sub);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .demo-select {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      max-width: 320px;
      transition: border-color 0.2s;
    }

    .demo-select:focus {
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn-run {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-run:hover:not(:disabled) {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-run:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-run:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #354c51;
      border-color: #4b666c;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      animation: pulse 1.5s infinite;
    }

    .status-dot.ready {
      background-color: var(--success);
      animation: none;
    }

    .status-dot.running {
      background-color: var(--accent);
      animation: pulse 0.8s infinite;
    }

    .status-dot.error {
      background-color: var(--error);
      animation: none;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* Main Container */
    main.workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 58px);
    }

    /* Left: Editor Pane */
    .pane-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border-color);
      min-width: 320px;
      background: var(--bg-editor);
    }

    .pane-header {
      background: var(--bg-header);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }

    .pane-header .file-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .pane-header .file-info i {
      color: var(--accent);
    }

    .editor-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* Right: Output Pane */
    .pane-output {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      background: #141f21;
      overflow: hidden;
      position: relative;
    }

    .output-tabs {
      display: flex;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
    }

    .output-tab {
      padding: 8px 18px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text-sub);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .output-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(255, 93, 0, 0.08);
    }

    .run-indicator {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      background: rgba(20, 31, 33, 0.72);
      backdrop-filter: blur(2px);
    }

    .run-indicator.is-running {
      display: flex;
    }

    .run-indicator-card {
      min-width: 210px;
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      background: var(--bg-header);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5), 0 0 24px rgba(255, 93, 0, 0.18);
      font-size: 0.9rem;
      font-weight: 600;
      animation: running-card-pulse 1.2s ease-in-out infinite alternate;
    }

    .run-indicator-spinner {
      width: 42px;
      height: 42px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255, 93, 0, 0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: running-spin 0.8s linear infinite;
    }

    .run-indicator-bars {
      height: 16px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .run-indicator-bars span {
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
      animation: running-wave 0.8s ease-in-out infinite alternate;
    }

    .run-indicator-bars span:nth-child(2) { animation-delay: -0.6s; }
    .run-indicator-bars span:nth-child(3) { animation-delay: -0.4s; }
    .run-indicator-bars span:nth-child(4) { animation-delay: -0.2s; }

    @keyframes running-wave {
      from { height: 4px; opacity: 0.55; }
      to { height: 16px; opacity: 1; }
    }

    @keyframes running-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes running-card-pulse {
      from { transform: scale(0.98); }
      to { transform: scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .run-indicator-bars span,
      .run-indicator-spinner,
      .run-indicator-card {
        animation: none;
      }
      .run-indicator-bars span {
        height: 8px;
      }
    }

    .output-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Plots Container */
    #plot-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 200px;
    }

    /* Pyodide Matplotlib Figure Card Styling */
    #plot-container > div {
      background: #ffffff !important;
      color: #1e293b !important;
      border-radius: 8px !important;
      padding: 12px 14px 16px 14px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #plot-container canvas {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 4px;
    }

    button.matplotlib-toolbar-button {
      font-size: 11.5px !important;
      padding: 4px 10px !important;
      margin: 2px !important;
      border-radius: 4px !important;
      cursor: pointer;
    }

    .empty-state {
      color: var(--text-sub);
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state i {
      font-size: 2.2rem;
      opacity: 0.5;
    }

    /* Terminal Output */
    #terminal-container {
      background: #0d1516;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: 'Fira Code', monospace;
      font-size: 0.83rem;
      color: #38bdf8;
      min-height: 120px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .terminal-err {
      color: #f87171 !important;
    }

    .terminal-info {
      color: var(--text-sub) !important;
      font-style: italic;
    }

    /* Responsive */
    @media (max-width: 900px) {
      main.workspace {
        flex-direction: column;
        height: auto;
        overflow-y: auto;
      }
      .pane-editor, .pane-output {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <div class="logo-title">
        <i class="fa-solid fa-wave-square" style="color: var(--accent);"></i>
        DSV <span>Playground</span>
      </div>
      <div class="logo-badge">TU Ilmenau • EMS</div>
    </div>

    <div class="controls">
      <select id="demo-select" class="demo-select" title="Vorlesungs-Demo wählen">
        <optgroup label="Vorlesung 01: Einführung & Dynamik">
          <option value="buddhabrot.py">Buddhabrot-Fraktal (Komplexe Zahlen & Dynamik) (buddhabrot.py)</option>
          <option value="mandelbrot.py">Mandelbrot-Menge (Diskrete Iteration) (mandelbrot.py)</option>
          <option value="complex_exp.py">Harmonische Exponentialschwingung (complex_exp.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 02: Harmonische Signale & Abtastung">
          <option value="cont_harms.py">Kontinuierliche Schwingungen & Phasoren (cont_harms.py)</option>
          <option value="disc_harms.py">Diskrete Schwingungen & Periodizität (disc_harms.py)</option>
          <option value="disc_harms_comp.py">Harmonische Trajektorien auf Einheitskreis (disc_harms_comp.py)</option>
          <option value="aliasing.py">Aliasing im Zeitbereich bei Unterabtastung (aliasing.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 03: Samplingtheorem & Rekonstruktion">
          <option value="sampling_theorem.py">Dirac-Kamm & Sinc-Rekonstruktion (sampling_theorem.py)</option>
          <option value="fourier_trafo.py">CFT des Rechteckpulses (Sinc-Spektrum) (fourier_trafo.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 04: Diskrete Signale & Systeme">
          <option value="even_odd.py">Gerade/Ungerade Signalzerlegung (even_odd.py)</option>
          <option value="accumulator.py">Diskreter Akkumulator (Gedächtnis) (accumulator.py)</option>
          <option value="complex_exp.py">Diskrete komplexe Exponentialfolge (complex_exp.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 05: LTI-Systeme & Differenzengleichungen">
          <option value="moving_average.py">Moving Average Glättungsfilter (moving_average.py)</option>
          <option value="ramp_ma.py">Kaskadierte Moving Averages & Rampe (ramp_ma.py)</option>
          <option value="cumulative_sum.py">Kumulatives Mittel (Rekursiv vs. Direkt) (cumulative_sum.py)</option>
          <option value="exp_mean.py">Exponentielles Mittel (1-Pol-IIR) (exp_mean.py)</option>
          <option value="square_root.py">Newton-Wurzelberechnung als LCCDE (square_root.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 06: Die z-Transformation">
          <option value="dtft_z.py">3D-Relief der z-Transformation & Einheitskreis (dtft_z.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 07: Fourier-Transformationen (CFT & DTFT)">
          <option value="fourier_series.py">Fourier-Reihe & Gibbs-Phänomen (fourier_series.py)</option>
          <option value="period_psd.py">Leistungsdichtespektrum (PSD) (period_psd.py)</option>
          <option value="dtft.py">DTFT des diskreten Sinc-Signals (dtft.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 08: Diskrete Fourier-Transformation (DFT)">
          <option value="dft_1.py">DFT: Matrix- vs. Schleifenberechnung (dft_1.py)</option>
          <option value="nyquist_seq.py">DC- vs. Nyquist-Sequenz im DFT-Gitter (nyquist_seq.py)</option>
          <option value="dft_conv.py">Schnelle Faltung im Frequenzbereich (dft_conv.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 09: Zeit-Frequenz-Analyse (STFT)">
          <option value="stft_win.py">Fensterfunktionen & Spectral Leakage (stft_win.py)</option>
          <option value="stft_length.py">Einfluss der Fensterbreite W (stft_length.py)</option>
          <option value="stft_harm.py">Spektrogramm harmonischer Töne (stft_harm.py)</option>
          <option value="stft_zp.py">Zero-Padding in STFT-Fensterblöcken (stft_zp.py)</option>
          <option value="stft_bass.py">Pitch Tracking einer Bassgitarre (stft_bass.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 11: Korrelation & Radar">
          <option value="radar1.py">Radar-Signale & Autokorrelation (radar1.py)</option>
          <option value="mlbs.py">MLBS-Erzeugung via LFSR (mlbs.py)</option>
          <option value="radar2.py">Pulskompression & Mehrzielradar (radar2.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 12: Stochastische Signale & Stationarität">
          <option value="random/discrete.py">Diskrete Zufallsvariablen & Dichte (random/discrete.py)</option>
          <option value="random/normal1.py">Normalverteilung (Histogramm vs. Gauß) (random/normal1.py)</option>
          <option value="random/signal1.py">Realisierungen stochastischer Prozesse (random/signal1.py)</option>
          <option value="random/signal2.py">Scharmittel vs. Zeitmittel (random/signal2.py)</option>
          <option value="random/signal3.py">Stationarität (WSS) & AKF-Schätzung (random/signal3.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 13: Quantisierung & Parameterschätzung">
          <option value="random/quantization1.py">Quantisierungskennlinie & Fehlersignal (random/quantization1.py)</option>
          <option value="random/quantization2.py">Quantisierungsrauschen & Area Sampling (random/quantization2.py)</option>
          <option value="random/quantization3.py">Widrow-Theorem: Dichterekonstruktion (random/quantization3.py)</option>
          <option value="random/paramest1.py">Parameterschätzung normalverteilter Signale (random/paramest1.py)</option>
        </optgroup>
        <optgroup label="Vorlesung 14: Moderne Abtasttheorie & B-Splines">
          <option value="bsplines_eval.py">Auswertung kubischer B-Splines (bsplines_eval.py)</option>
          <option value="bsplines_coeffs.py">Unser-Algorithmus (IIR-Rekursionsfilter) (bsplines_coeffs.py)</option>
        </optgroup>
      </select>

      <button id="btn-run" class="btn btn-run" title="Skript ausführen (Strg + Enter)">
        <i class="fa-solid fa-play"></i>
        <span>Ausführen</span>
      </button>

      <button id="btn-reset" class="btn btn-secondary" title="Code auf Originalzustand zurücksetzen">
        <i class="fa-solid fa-rotate-left"></i>
        <span>Reset</span>
      </button>

      <button id="btn-share" class="btn btn-secondary" title="Link zu diesem Skript kopieren">
        <i class="fa-solid fa-link"></i>
      </button>

      <div class="status-pill" id="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Lade WebAssembly...</span>
      </div>
    </div>
  </header>

  <!-- Workspace -->
  <main class="workspace">
    <!-- Left: Code Editor -->
    <section class="pane-editor">
      <div class="pane-header">
        <div class="file-info">
          <i class="fa-brands fa-python"></i>
          <span id="current-filename">aliasing.py</span>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-sub);">
          <kbd style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">Strg + Enter</kbd> zum Starten
        </div>
      </div>
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
    </section>

    <!-- Right: Output Pane -->
    <section class="pane-output">
      <div class="output-tabs">
        <button class="output-tab active" id="tab-output">
          <i class="fa-solid fa-chart-line"></i>
          <span>Plots & Ausgabe</span>
        </button>
        <div style="flex: 1;"></div>
        <button id="btn-clear-out" style="background: none; border: none; color: var(--text-sub); padding: 0 14px; cursor: pointer; font-size: 0.8rem;" title="Ausgabe leeren">
          <i class="fa-solid fa-trash-can"></i> Leeren
        </button>
      </div>

      <div id="run-indicator" class="run-indicator" role="status" aria-live="polite" aria-hidden="true">
        <div class="run-indicator-card">
          <div class="run-indicator-spinner" aria-hidden="true">
            <div class="run-indicator-bars">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <span>Skript wird ausgeführt …</span>
        </div>
      </div>

      <div class="output-content">
        <!-- Rendered Plots -->
        <div id="plot-container">
          <div class="empty-state">
            <i class="fa-regular fa-image"></i>
            <span>Hier erscheinen generierte Matplotlib-Grafiken.<br>Klicken Sie oben auf <strong>Ausführen</strong>.</span>
          </div>
        </div>

        <!-- Terminal Output -->
        <div style="margin-top: 8px;">
          <div style="font-size: 0.78rem; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between;">
            <span><i class="fa-solid fa-terminal"></i> Terminal / Konsolen-Ausgabe:</span>
          </div>
          <div id="terminal-container"><span class="terminal-info">Warte auf Programmausführung...</span></div>
        </div>
      </div>
    </section>
  </main>

  <!-- CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <!-- Main Playground Logic -->
  <script>
    // Embedded course catalog (all 44 scripts)
    const EMBEDDED_SCRIPTS = {"accumulator.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nn = np.arange(100)\nx_1_n = np.cos(2 * np.pi * 0.1 * n)\nx_2_n = np.cos(2 * np.pi * 0.5 * n) * np.exp(\n    -n / 20\n)\n\ny_0 = -1\n\n\ny_1_n = np.concatenate(\n    [[y_0], y_0 + np.cumsum(x_1_n)]\n)\ny_2_n = np.concatenate(\n    [[y_0], y_0 + np.cumsum(x_2_n)]\n)\n\nplt.subplot(211)\nplt.stem(\n    np.arange(100),\n    x_1_n,\n    label=\"x1[n]\",\n    linefmt=\"b\",\n)\nplt.stem(\n    np.arange(100) + 0.1,\n    x_2_n,\n    label=\"x2[n]\",\n    linefmt=\"r\",\n)\nplt.legend()\nplt.subplot(212)\nplt.stem(\n    np.arange(101),\n    y_1_n,\n    label=\"y1[n]\",\n    linefmt=\"b\",\n)\nplt.stem(\n    np.arange(101) + 0.1,\n    y_2_n,\n    label=\"y2[n]\",\n    linefmt=\"r\",\n)\nplt.legend()\nplt.show()\n", "aliasing.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\ntheta = -np.pi / 2  # rad\nF = 1.5  # Hz\nF_s = 1.8  # Hz\nT_s = 1.0 / F_s  # s\n\nF_alias1 = F - 1 * F_s  # Hz\nF_alias2 = F + 1 * F_s  # Hz\n\n\ndef x_a(t, F, theta):\n    return np.cos(2 * np.pi * F * t + theta)\n\n\nT = np.linspace(0, 3, 301, endpoint=True)  # s\nn = np.arange(4) * T_s  # none\n\nplt.plot(T, x_a(T, F, theta), label=\"x_a\")\nplt.plot(\n    T, x_a(T, F_alias1, theta), label=\"x_alias1\"\n)\nplt.plot(\n    T, x_a(T, F_alias2, theta), label=\"x_alias2\"\n)\nplt.scatter(\n    n, x_a(n, F, theta), color=\"r\", label=\"x[n]\"\n)\nplt.legend()\nplt.show()\n", "bsplines_coeffs.py": "import numpy as np\n\n\ndef filter_coeffs(x_n: np.ndarray) -> np.ndarray:\n    z_1: float = np.sqrt(3) - 2.0\n    c_k_p: np.ndarray = np.zeros_like(x_n)\n    c_k_m: np.ndarray = np.zeros_like(x_n)\n\n    c_k_p[0] = np.sum(\n        x_n * np.power(z_1, np.arange(x_n.size))\n    )\n\n    for kk in range(1, x_n.size):\n        c_k_p[kk] = x_n[kk] + z_1 * c_k_p[kk - 1]\n\n    c_k_m[-1] = (\n        z_1\n        * (c_k_p[-1] + z_1 * c_k_p[-2])\n        / (1.0 - z_1**2)\n    )\n\n    for kk in range(2, x_n.size + 1):\n        c_k_m[-kk] = z_1 * (\n            c_k_m[-kk + 1] + c_k_p[-kk]\n        )\n\n    return -6 * c_k_m\n", "bsplines_eval.py": "import numpy as np\n\n\ndef cubic_spline(t: np.ndarray) -> np.ndarray:\n    s1: np.ndarray = (\n        2.0 / 3.0\n        - np.abs(t) ** 2\n        + 0.5 * np.abs(t) ** 3\n    )\n    s2: np.ndarray = (2 - np.abs(t)) ** 3 / 6\n    s3: np.ndarray = np.zeros_like(t)\n    return (\n        s3\n        + s1 * (np.abs(t) < 1)\n        + s2 * (np.abs(np.abs(t) - 1.5) <= 0.5)\n    )\n", "buddhabrot.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef sample(\n    x_0: complex, low: int, hgh: int\n) -> tuple[bool, int]:\n    x_n: int = x_0\n    counter: int = 0\n    while (\n        x_n.real**2 + x_n.imag**2\n    ) < 4 and counter < hgh:\n        x_n = x_n**2 + x_0\n        counter += 1\n\n    return (\n        (low <= counter) and (counter <= hgh),\n        counter,\n    )\n\n\ndef trial():\n    while True:\n        yield np.random.uniform(\n            -2, +2\n        ) + 1j * np.random.uniform(-2, +2)\n\n\nsuccess = []\nfor tt in trial():\n    valid, counter = sample(tt, 100, 50000)\n    if valid:\n        success += [(tt, counter)]\n    if len(success) > 400:\n        break\n\nimage = np.zeros((1024, 1024), dtype=int)\nfor ss in success:\n    x_n = ss[0]\n    for ii in range(ss[1]):\n        image[\n            int(\n                image.shape[0]\n                * (x_n.real / 2 + 0.5)\n            )\n            % image.shape[0],\n            int(\n                image.shape[1]\n                * (x_n.imag / 2 + 0.5)\n            )\n            % image.shape[1],\n        ] += 1\n        x_n = x_n**2 + ss[0]\n\nplt.imshow(image ** (0.01), cmap=\"bone\")\nplt.show()\n", "complex_exp.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef complex_exp(\n    n: np.ndarray[int], a: complex\n) -> np.ndarray[complex]:\n    return np.abs(a) ** n * np.exp(\n        1j * np.angle(a) * n\n    )\n\n\nn = np.linspace(-2, +10, 13, dtype=int)\na = 0.4 + 1j * 0.6\nplt.stem(\n    n,\n    complex_exp(n, a).real,\n    linefmt=\"r\",\n    label=\"real\",\n)\nplt.stem(\n    n + 0.1,\n    complex_exp(n, a).imag,\n    linefmt=\"b\",\n    label=\"imag\",\n)\nplt.legend()\nplt.show()\n", "cont_harms.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nA = 1.5\nF = 2\ntheta = np.pi / 2\n\n\ndef harm(t: float) -> float:\n    return A * np.cos(\n        2 * np.pi * (F * t + theta))\n\n\ndef phasor(t: float) -> complex:\n    return 0.5 * A * np.exp(\n        -1j * (2 * np.pi * (F * t + theta)))\n\n\nT = np.linspace(0, 1, 255)\nplt.plot(T, harm(T), label=\"harm(T)\")\nplt.plot(T, phasor(T) + phasor(T).conj(), \n         linestyle=\"--\", label=\"harm(T)\")\nplt.xlabel(\"t\")\nplt.show()\n", "cumulative_sum.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef cumulative_sum(\n    x: np.ndarray, n: np.ndarray\n) -> np.ndarray:\n    y = np.zeros(n.size)\n    for nn in n:\n        y[nn] = np.sum(x[:nn]) / (nn + 1)\n\n    return y\n\n\ndef cumulative_sum_rec(\n    y: float, x: float, n: int\n):\n    return (n / (n + 1.0)) * y + 1.0 / (\n        n + 1\n    ) * x\n\n\nn = np.arange(20)\nf = 1.0 / np.exp(1)\nx = np.cos(2 * np.pi * f * n)\n\ny1 = cumulative_sum(x, n)\ny2 = [0]\nfor nn in n[1:]:\n    y2.append(\n        cumulative_sum_rec(\n            y2[nn - 1], x[nn - 1], nn\n        )\n    )\nplt.stem(n, x, linefmt=\"r\", label=\"x[n]\")\nplt.stem(n + 0.1, y1, linefmt=\"b\", label=\"y[n]\")\nplt.stem(\n    n + 0.2, y2, linefmt=\"g\", label=\"y_rec[n]\"\n)\nplt.legend()\nplt.show()\n", "dft_1.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef x_k(k: int, N: int) -> np.ndarray[complex]:\n    return np.exp(\n        1j * 2 * np.pi * k * np.arange(N) / N\n    )\n\n\nN = 40\nx = np.zeros(N)\nk = N // 4\nx[:k] += np.ones(k)\n\nc1 = np.array(\n    [\n        (x * x_k(kk, N).conj()).sum() / N\n        for kk in range(N)\n    ]\n)\nF = np.array([x_k(kk, N) for kk in range(N)]).T\nc2 = F.conj().T.dot(x) / N\n\nplt.subplot(211)\nplt.stem(x)\n\nplt.subplot(212)\nplt.stem(\n    np.arange(N),\n    np.abs(c1),\n    linefmt=\"r\",\n    label=\"Abs(c1)\",\n)\nplt.stem(\n    np.arange(N) + 0.2,\n    np.abs(c2),\n    linefmt=\"b\",\n    label=\"Abs(c2)\",\n)\nplt.legend()\nplt.show()\n", "dft_conv.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 64\nF = 3\nT = np.linspace(0, 1, N)\ncutOff = 0.05\nsin = np.sin(2 * np.pi * 3 * T)\nx = sin + 0.1 * np.random.randn(N)\nh = np.zeros_like(T) + 1 * (T < cutOff)\nh /= np.sum(h)\n\n# zirkulare faltung im zeitbereich\n# |\\Cref{eq:fourier:cyclic_conv}|\ny1 = np.convolve(x, np.tile(h, 2))[N : 2 * N]\ny2 = np.fft.ifft(\n    np.fft.fft(x) * np.fft.fft(h)\n).real\n\nplt.subplot(311)\nplt.plot(T, sin, color=\"blue\")\nplt.stem(T, x, linefmt=\"r\")\n\nplt.subplot(312)\nplt.stem(T, h)\n\nplt.subplot(313)\nplt.plot(T, sin, color=\"blue\")\nplt.stem(T, y1, linefmt=\"r\")\nplt.stem(T + 1 / (5 * N), y2, linefmt=\"g\")\n\nplt.show()\n", "disc_harms.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nA = 1.5\nf = 0.1\ntheta = 0.25\n\n\ndef harm(n: int) -> float:\n    return A * np.cos(\n        2 * np.pi * (f * n + theta))\n\n\nn = np.arange(16)\nplt.stem(n, harm(n), label=\"harm[n]\")\nplt.xlabel(\"n\")\nplt.show()\n", "disc_harms_comp.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nA = 1\nf = 1 / 16\n# f = 1 / (5 * np.exp(1))\ntheta = np.pi / 2\n# N = 32\nN = 720\n\n\ndef harm(\n    n: np.ndarray[int],\n) -> np.ndarray[complex]:\n    return A * np.exp(\n        1j * 2 * np.pi * (f * n + theta)\n    )\n\n\nn = np.arange(N)\nx_n = harm(n)\nfig, ax = plt.subplots(\n    subplot_kw={\"projection\": \"polar\"}\n)\nax.plot(\n    np.angle(x_n),\n    np.abs(x_n),\n    marker=\"o\",\n    linewidth=0,\n)\nplt.show()\n", "dtft.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef dtft(\n    x: np.ndarray[complex],\n    n: np.ndarray[int],\n    F: np.ndarray[float],\n) -> np.ndarray[complex]:\n    return np.array(\n        [\n            (\n                x * np.exp(-2j * np.pi * n * f)\n            ).sum()\n            for f in F\n        ]\n    )\n\n\ndef idtft(\n    X: np.ndarray[complex],\n    F: np.ndarray[float],\n    n: np.ndarray[int],\n):\n    return np.array(\n        [\n            (F[1] - F[0])\n            * (\n                X * np.exp(2j * np.pi * nn * F)\n            ).sum()\n            for nn in n\n        ]\n    )\n\n\nN = 20\nn = np.linspace(-N, +N, 2 * N + 1)\nomega = 1 / np.pi\n\nx = np.sin(omega * n) / (np.pi * n)\nx[N] = omega / np.pi\nF = np.linspace(-0.5, +0.5, 201)\nX_approx = dtft(x, n, F)\nX_true = np.zeros_like(F)\nX_true[np.abs(F) <= omega / (2 * np.pi)] += 1\n\nx_approx = idtft(X_approx, F, n)\nx_true = idtft(X_true, F, n)\n\nplt.subplot(311)\nplt.stem(n, x, label=\"x[n]\")\nplt.xlabel(\"n\")\nplt.legend()\n\nplt.subplot(312)\nplt.plot(F, X_approx, label=\"X_approx(f)\")\nplt.plot(F, X_true, label=\"X_true(f)\")\nplt.xlabel(\"f\")\nplt.legend()\n\nplt.subplot(313)\nplt.stem(n, x, linefmt=\"r\", label=\"x[n]\")\nplt.stem(\n    n + 0.1,\n    x_approx,\n    linefmt=\"g\",\n    label=\"x_approx[n]\",\n)\nplt.stem(\n    n + 0.2,\n    x_true,\n    linefmt=\"b\",\n    label=\"x_true[n]\",\n)\nplt.xlabel(\"n\")\nplt.legend()\nplt.show()\n", "dtft_z.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom matplotlib import colormaps\n\nN = 40\nx = np.zeros(N)\nk = N // 4\nx[:k] += np.ones(k)\n\nres = 128\nreal = np.linspace(-2, +2, res, endpoint=True)\nimag = np.linspace(-2, +2, res, endpoint=True)\nzValues = np.concatenate(\n    [\n        gg.flatten()[None, :]\n        for gg in np.meshgrid(\n            real,\n            imag,\n        )\n    ]\n).T\n\nzTrafo = np.array(\n    [\n        (\n            x\n            * (zz[0] + 1j * zz[1])\n            ** (-np.arange(N))\n        ).sum()\n        for zz in zValues\n    ]\n).reshape(res, res)\n\ndtftValues = np.exp(\n    1j\n    * 2\n    * np.pi\n    * np.linspace(0, 1, 201, endpoint=True)\n)\ndtft = np.array(\n    [\n        (x * zz ** (-np.arange(N))).sum()\n        for zz in dtftValues\n    ]\n)\ndft = np.fft.fft(x)\n\nfig, ax = plt.subplots(\n    subplot_kw={\"projection\": \"3d\"}\n)\nax.plot_surface(\n    zValues[:, 0].reshape(res, res),\n    zValues[:, 1].reshape(res, res),\n    np.minimum(\n        np.maximum(np.log(np.abs(zTrafo)), -5),\n        5,\n    ),\n    cmap=colormaps[\"bone_r\"],\n    alpha=0.5,\n    shade=True,\n)\nax.plot(\n    dtftValues.real,\n    dtftValues.imag,\n    np.minimum(\n        np.maximum(np.log(np.abs(dtft)), -5),\n        5,\n    ),\n    color=\"b\",\n    label=\"log|dtft(x)|\",\n    zorder=-3,\n)\nax.stem(\n    np.cos(2 * np.pi * np.fft.fftfreq(x.size)),\n    np.sin(2 * np.pi * np.fft.fftfreq(x.size)),\n    np.minimum(\n        np.maximum(np.log(np.abs(dft)), -5),\n        5,\n    ),\n    linefmt=\"r\",\n    markerfmt=\"*r\",\n    label=\"log|dft(x)|\",\n)\nplt.legend()\nplt.show()\n", "even_odd.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\n# assume n=0 in center, size(x_n) = 2K+1\ndef even(x_n: np.ndarray) -> np.ndarray:\n    return 0.5 * (x_n + x_n[::-1])\n\n\n# assume n=0 in center, size(x_n) = 2K+1\ndef odd(x_n: np.ndarray) -> np.ndarray:\n    return 0.5 * (x_n - x_n[::-1])\n\n\nK = 7\nn = np.linspace(-K, +K, 2 * K + 1)\nx_n = np.random.randn(n.size)\n\nplt.stem(n, x_n, linefmt=\"g\", label=\"x_n\")\nplt.stem(\n    n + 0.05, even(x_n), linefmt=\"r\", label=\"x_g\"\n)\nplt.stem(\n    n - 0.05, odd(x_n), linefmt=\"b\", label=\"x_u\"\n)\nplt.stem(\n    n - 0.1,\n    even(x_n) + odd(x_n),\n    linefmt=\"y\",\n    label=\"x_g + x_u\",\n)\nplt.legend()\nplt.axvline(0)\nplt.show()\n", "exp_mean.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef exp_mean(\n    x: np.ndarray, alpha: float\n) -> np.ndarray:\n    y = np.zeros_like(x)\n    y[0] = 0\n    for ii in range(1, y.size):\n        y[ii] = (\n            alpha * y[ii - 1]\n            + (1 - alpha) * x[ii]\n        )\n\n    return y\n\n\nalpha1 = 0.5\nalpha2 = 0.1\nN = 20\nL = 3\nn = np.arange(N)\nl = np.arange(L)\ndelta = np.eye(L)[0]\nh1 = exp_mean(\n    np.pad(delta, (L, L), mode=\"constant\"),\n    alpha1,\n)[L:-L]\nh2 = exp_mean(\n    np.pad(delta, (L, L), mode=\"constant\"),\n    alpha2,\n)[L:-L]\n\nx = np.random.randn(N)\ny1 = exp_mean(\n    np.pad(x, (L, L), mode=\"constant\"), alpha1\n)[L:-L]\ny2 = exp_mean(\n    np.pad(x, (L, L), mode=\"constant\"), alpha2\n)[L:-L]\nxh1 = np.convolve(\n    np.pad(x, (L, L), mode=\"constant\"),\n    h1,\n)[L : -(L - 1) - L]\nxh2 = np.convolve(\n    np.pad(x, (L, L), mode=\"constant\"),\n    h2,\n)[L : -(L - 1) - L]\n\nplt.subplot(211)\nplt.stem(\n    l, h1, linefmt=\"r\", label=f\"h({alpha1})\"\n)\nplt.stem(\n    l + 0.1,\n    h2,\n    linefmt=\"b\",\n    label=f\"h({alpha2})\",\n)\nplt.legend()\n\nplt.subplot(212)\nplt.stem(\n    n, y1, linefmt=\"g\", label=f\"y({alpha1})\"\n)\nplt.stem(\n    n + 0.2,\n    y2,\n    linefmt=\"y\",\n    label=f\"y({alpha2})\",\n)\nplt.stem(\n    n + 0.1,\n    xh1,\n    linefmt=\"r\",\n    label=f\"x * h({alpha1})\",\n)\nplt.stem(\n    n + 0.3,\n    xh2,\n    linefmt=\"b\",\n    label=f\"x * h({alpha2})\",\n)\nplt.legend()\nplt.show()\n", "fourier_series.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.integrate import quad\n\nT_0 = 1.0\nF_0 = 1.0 / T_0\nKmax = 30\n\n\ndef rect(t: float) -> float:\n    if (t < 0.0) or (t > 0.8):\n        return 0\n    else:\n        return 1\n\n\ndef x_k(t: float, k: int) -> complex:\n    return np.exp(1j * 2 * np.pi * F_0 * k * t)\n\n\ndef synth(\n    t: float, c_k: list[complex], allK: list[int]\n) -> complex:\n    return np.sum(\n        cckk * x_k(t, kk)\n        for kk, cckk in zip(allK, c_k)\n    )\n\n\nallK = np.linspace(\n    -Kmax, +Kmax, 2 * Kmax + 1, dtype=int\n)\nc_k = np.array(\n    [\n        quad(\n            lambda t: x_k(t, kk).conj()\n            * rect(t),\n            0,\n            T_0,\n            complex_func=True,\n        )[0]\n        for kk in allK\n    ]\n)\n\nplt.figure()\nplt.subplot(121)\nplt.stem(\n    allK, c_k.real, linefmt=\"b\", label=\"Re(c_k)\"\n)\nplt.stem(\n    allK + 0.1,\n    c_k.imag,\n    linefmt=\"r\",\n    label=\"Im(c_k)\",\n)\nplt.legend()\n\nallT = np.linspace(0, T_0, 401, endpoint=False)\nplt.subplot(122)\nplt.plot(\n    allT, [rect(tt) for tt in allT], label=\"x\"\n)\nplt.plot(\n    allT,\n    [synth(tt, c_k, allK) for tt in allT],\n    label=\"sum c_k x_k\",\n)\nplt.legend()\nplt.show()\n", "fourier_trafo.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.integrate import quad\n\n\ndef rect(t: float) -> float:\n    if np.abs(t) < 0.75:\n        return 1\n    else:\n        return 0\n\n\ndef kernel(t: float, F: float) -> complex:\n    return np.exp(1j * 2 * np.pi * F * t)\n\n\ndef analyse(x, Trange: list[float]):\n    def x_ft(F: float):\n        return quad(\n            lambda t: kernel(-t, F) * x(t),\n            np.min(Trange),\n            np.max(Trange),\n            complex_func=True,\n        )[0].real\n\n    return x_ft\n\n\ndef synthese(X, Frange: list[float]):\n    def x(t: float):\n        return quad(\n            lambda F: kernel(t, F) * X(F),\n            np.min(Frange),\n            np.max(Frange),\n            complex_func=True,\n        )[0].real\n\n    return x\n\n\nTrange = np.linspace(-3, +3, 121, endpoint=True)\nFrange = np.linspace(-6, +6, 121, endpoint=True)\n\nrect_ft = analyse(rect, Trange)\nrect_synth = synthese(rect_ft, Frange)\n\n\nplt.figure()\nplt.subplot(211)\nplt.plot(\n    Trange,\n    [rect(tt) for tt in Trange],\n)\nplt.plot(\n    Trange,\n    [rect_synth(tt) for tt in Trange],\n)\nplt.legend()\n\nplt.subplot(212)\n\nplt.plot(\n    Frange,\n    [rect_ft(ff) for ff in Frange],\n)\nplt.legend()\nplt.show()\n", "mandelbrot.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nNx = 2**11\nNy = 2**11\n# Rx = (-2.25, +1.25)\nRx = (-1.908, -1.906)\n# Ry = (-1.75, +1.75)\nRy = (-0.001, +0.001)\nc = np.add.outer(\n    np.linspace(*Rx, Nx, endpoint=True),\n    1j * np.linspace(*Ry, Ny, endpoint=True),\n)\nz = c.copy()\n\nactive = (z.real**2 + z.imag**2) < 4\ncounter = np.zeros((Nx, Ny))\nfor ii in range(100):\n    z[active] = z[active] ** 2 + c[active]\n    counter[active] += 1\n    active = (z.real**2 + z.imag**2) < 4\n\nplt.imshow(counter.T**0.3, cmap=\"bone_r\")\nplt.show()\n", "mlbs.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef gen_MLBS(taps: int, start: int):\n    numTaps = int(\n        np.ceil(np.log2(taps)).astype(int)\n    )\n    length = 2**numTaps - 1\n    state = start\n\n    sequence = []\n    for ll in range(length):\n        # move last bit to output\n        sequence.append(state & 1)\n        feedback = state\n        for tt in range(1, numTaps - 1):\n            if (taps >> (numTaps - tt - 1)) & 1:\n                feedback ^= state >> tt\n        # keep only last bit of combined XOR\n        feedback &= 1\n        # shift registers\n        state = state >> 1\n        # feedback from back to front\n        state |= feedback << (numTaps - 1)\n\n    sequence = 2 * (np.array(sequence) - 0.5)\n    return sequence\n\n\nif __name__ == \"__main__\":\n    sequence = gen_MLBS(0xC + 1, 1)\n    plt.stem(sequence)\n    plt.show()\n", "moving_average.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 10\nl = 4\nnIn = np.linspace(0, N - 1, N)\nnOut = np.linspace(-l, N - 1 + l, N + 2 * l)\n\n\ndef MA(x, l):\n    xpad = np.pad(x, (l, l))\n    y = np.zeros_like(xpad)\n    for n in range(x.size + l):\n        y[n] = np.mean(xpad[n : n + l])\n    return y\n\n\ndelta = np.eye(N)[0, :]\nh = MA(delta, l)\nx = np.random.randn(N)\ny1 = MA(x, l)\ny2 = np.convolve(x, h[: 2 * l + 1])\n\nplt.subplot(211)\nplt.stem(nIn, delta, linefmt=\"r\", label=\"delta\")\nplt.stem(nOut + 0.1, h, linefmt=\"b\", label=\"h\")\nplt.legend()\nplt.subplot(212)\nplt.stem(nIn, x, linefmt=\"r\", label=\"x\")\nplt.stem(\n    nOut + 0.1, y1, linefmt=\"b\", label=\"MA(x)\"\n)\nplt.stem(\n    nOut + 0.2, y2, linefmt=\"g\", label=\"x * h\"\n)\nplt.legend()\nplt.show()\n", "nyquist_seq.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 8\n\nX = np.fft.fft(np.eye(N))\nx_DC = X[:, 0]\nx_Nyquist = X[:, N // 2]\n\nplt.stem(\n    np.arange(N),\n    x_DC,\n    linefmt=\"b\",\n    label=\"DC-Sequenz\",\n)\nplt.stem(\n    np.arange(N) + 0.1,\n    x_Nyquist,\n    linefmt=\"r\",\n    label=\"Nyquist-Sequenz\",\n)\nplt.legend()\nplt.show()\n", "period_psd.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.integrate import quad\n\nT_0 = 2\nF_0 = 1.0 / T_0\nKmax = 30\n\n\ndef x(t: float) -> float:\n    if (t < 0.0) or (t > 0.1):\n        return 0\n    else:\n        return 1\n\n\ndef x_k(t: float, k: int) -> complex:\n    return np.exp(1j * 2 * np.pi * F_0 * k * t)\n\n\ndef synth(\n    t: float, c_k: list[complex], allK: list[int]\n) -> complex:\n    return np.sum(\n        cckk * x_k(t, kk)\n        for kk, cckk in zip(allK, c_k)\n    )\n\n\nallK = np.linspace(\n    -Kmax, +Kmax, 2 * Kmax + 1, dtype=int\n)\nc_k = np.array(\n    [\n        quad(\n            lambda t: x_k(t, kk).conj() * x(t),\n            0,\n            T_0,\n            complex_func=True,\n        )[0]\n        for kk in allK\n    ]\n)\n\nplt.figure()\nplt.stem(\n    allK * F_0, np.abs(c_k) ** 2, linefmt=\"b\"\n)\nplt.ylabel(\"|c_k|^2\")\nplt.xlabel(\"Frequenz\")\nplt.show()\n", "radar1.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.special import sinc\n\n\ndef gen_receive(x, tau, gamma):\n    return np.sum(\n        [\n            np.roll(x, tt) * gg\n            for tt, gg in zip(tau, gamma)\n        ],\n        axis=0,\n    )\n\n\nN = 64\ntau = [14, 34]\ngamma = [1, 0.75]\n\nx = np.sin(np.linspace(0, 10 * np.pi, N))\nx = np.sinc(np.linspace(-25, +25, N))\n# x = np.sign(np.random.randn(N))\nX = np.fft.fft(x)\n\ny = gen_receive(x, tau, gamma)\nY = np.fft.fft(y)\n\n# |\\Cref{eq:mseq:corr_conv}|\nr_xy = np.fft.ifft(Y * X.conj())\n\nif __name__ == \"__main__\":\n    plt.subplot(211)\n    plt.stem(x)\n    plt.subplot(212)\n    plt.plot(np.abs(r_xy), label=\"r_xy\")\n\n    plt.stem(\n        tau,\n        np.array(gamma) * np.max(np.abs(r_xy)),\n        linefmt=\"r\",\n        label=\"true\",\n    )\n    plt.legend()\n    plt.show()\n", "radar2.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom mlbs import gen_MLBS\nfrom radar1 import gen_receive\n\nx = gen_MLBS(0x44, 1)\n\ntau = [14, 34]\ngamma = [1, 0.3]\n\nN = x.size\n\nx = x\nX = np.fft.fft(x)\n\ny = gen_receive(x, tau, gamma) + (\n    0.5 * np.random.randn(x.size)\n)\nY = np.fft.fft(y)\n\nr_xy = np.fft.ifft(Y * X.conj())\n\nplt.subplot(311)\nplt.title(\"y\")\nplt.stem(y)\nplt.subplot(312)\nplt.title(\"DFT(x)\")\nplt.stem(np.abs(X))\nplt.subplot(313)\nplt.title(\"r_{x,y}\")\nplt.plot(np.abs(r_xy), label=\"r_xy\")\nplt.stem(\n    tau,\n    np.array(gamma) * np.max(np.abs(r_xy)),\n    linefmt=\"r\",\n    label=\"true\",\n)\nplt.legend()\nplt.show()\n", "ramp_ma.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 50\nl = 3\nnIn = np.linspace(0, N - 1, N)\nnOut = np.linspace(-l, N - 1, N + 1 * l)\nnOut2 = np.linspace(-2 * l, N - 1, N + 2 * l)\nnOut3 = np.linspace(-3 * l, N - 1, N + 3 * l)\n\n\ndef MA(x, l):\n    xpad = np.pad(x, (l, l))\n    y = np.zeros_like(xpad)\n    for n in range(x.size + l):\n        y[n] = np.mean(xpad[n : n + l])\n    return y[:-l]\n\n\ndef MA2(x, l):\n    return MA(MA(x, l), l)\n\n\ndelta = np.eye(N)[0, :]\nh1 = MA(delta, l)\nh2 = MA2(delta, l)\nh3 = MA2(MA(delta, l), l)\nh4 = MA(MA2(delta, l), l)\n\nx = np.random.randn(N)\ny1 = MA(x, l)\ny2 = MA2(x, l)\ny3 = MA(MA2(x, l), l)\n\nplt.subplot(211)\nplt.stem(\n    nIn[: l + 1],\n    delta[: l + 1],\n    linefmt=\"r\",\n    label=\"delta\",\n)\nplt.stem(\n    nOut[: 2 * l + 1] + 0.05,\n    h[: 2 * l + 1],\n    linefmt=\"b\",\n    label=\"h1\",\n)\nplt.stem(\n    nOut2[: 2 * l + 1] + 0.1,\n    h2[: 2 * l + 1],\n    linefmt=\"y\",\n    label=\"h2\",\n)\nplt.stem(\n    nOut3[: 3 * l + 1] + 0.15,\n    h3[: 3 * l + 1],\n    linefmt=\"g\",\n    label=\"h1 * h2\",\n)\nplt.stem(\n    nOut3[: 3 * l + 1] + 0.2,\n    h4[: 3 * l + 1],\n    linefmt=\"g\",\n    label=\"h2 * h1\",\n)\nplt.legend()\nplt.subplot(212)\nplt.stem(nIn, x, linefmt=\"r\", label=\"x\")\nplt.stem(\n    nOut + 0.1, y1, linefmt=\"b\", label=\"MA(x)\"\n)\nplt.stem(\n    nOut2 + 0.2, y2, linefmt=\"y\", label=\"MA2(x)\"\n)\nplt.stem(\n    nOut3 + 0.3,\n    y3,\n    linefmt=\"g\",\n    label=\"MA2(MA(x))\",\n)\nplt.legend()\nplt.show()\n", "sampling_theorem.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nF_max = 1.0\nF = np.random.choice(\n    np.linspace(\n        -F_max, +F_max, 11, endpoint=True\n    ),\n    5,\n    replace=False,\n)  # Hz\ntheta = np.random.uniform(0, 2 * np.pi, 5)  # rad\nA = np.random.randn(5)  # amplitude\n\n\ndef x_a(t: np.ndarray) -> np.ndarray:\n    return np.sum(\n        np.cos(\n            2 * np.pi * np.outer(t, F) + theta\n        )\n        * A,\n        axis=1,\n    )\n\n\nt = np.linspace(0, 5, 1024)\n\nF_s = 3\n\n\ndef g(t: np.ndarray) -> np.ndarray:\n    nenner = np.pi * F_s * t\n    nenner[np.isclose(t, 0)] = 1\n    result = np.sin(np.pi * F_s * t) / nenner\n    result[np.isclose(t, 0)] = 1\n    return result\n\n\nn = (\n    np.arange(int(t[-1] * F_s)).astype(float)\n    / F_s\n)\nx_n = x_a(n)\ninterpol = np.zeros_like(t)\nfor nn in np.arange(len(n)):\n    interpol += x_n[nn] * g(t - nn / F_s)\n    plt.plot(\n        t,\n        x_n[nn] * g(t - nn / F_s),\n        color=\"grey\",\n    )\nplt.scatter(n, x_n, label=\"x[n]\")\nplt.plot(\n    t,\n    x_a(t),\n    color=\"black\",\n    linewidth=2,\n    label=\"x_a\",\n)\nplt.plot(t, interpol, color=\"red\", linewidth=2)\nplt.legend()\nplt.show()\n", "square_root.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef root(A: float, y0: float, n):\n    y = [y0]\n    for ii in range(n):\n        y.append((y[-1] + A / y[-1]) / 2)\n\n    return y\n\n\nA = 5.0\nrootA = np.sqrt(A)\ny = root(A, 1.0, 6)\n\nplt.subplot(211)\nplt.stem(y)\nplt.ylabel(\"y[n]\")\nplt.xlabel(\"Iteration n\")\nplt.axhline(rootA, linestyle=\"--\", color=)\nplt.subplot(212)\nplt.semilogy(\n    np.abs(np.array(y) - rootA)\n)\nplt.ylabel(\"log(|y[n] - sqrt(A)|)\")\nplt.xlabel(\"Iteration n\")\nplt.show()\n", "stft_bass.py": "import numpy as np\nimport matplotlib.pyplot as plt\nimport scipy.io\nimport scipy.signal\n\nF_s, x = scipy.io.wavfile.read(\n    \"../data/g_maj.wav\"\n)\n\nsliceRun = slice(\n    int(0.08 * F_s), int(4.25 * F_s)\n)\nT = np.linspace(\n    0, x.size / F_s, x.size, endpoint=False\n)\n\ny = x[sliceRun][\n    : int(np.floor(x[sliceRun].size / 14) * 14)\n].reshape((14, -1))[:, 1000:-1000]\nN = y.shape[1]\n\ndfts = np.fft.fft(y, axis=1)\nfreqs = np.fft.fftfreq(N) * F_s\nplotInd = np.logical_and(\n    (np.abs(freqs)) < 200, freqs > 0\n)\n\nplt.figure()\nplt.subplot(211)\nplt.plot(T[sliceRun], x[sliceRun], linewidth=0.4)\nplt.xlabel(\"t[s]\")\nplt.ylabel(\"x[n]\")\nplt.subplot(212)\nfor dd in range(8):\n    spectrum_dB = 10 * np.log10(\n        np.abs(dfts[dd, :]) ** 2\n    )\n    plt.plot(\n        freqs[plotInd],\n        spectrum_dB[plotInd],\n    )\n    peakSearch = scipy.signal.find_peaks(\n        spectrum_dB, height=120\n    )\n    peaksPos = peakSearch[0]\n    peaksHeight = peakSearch[1][\"peak_heights\"]\n    filterPeaks = np.logical_and(\n        freqs[peaksPos] > 0,\n        freqs[peaksPos] < 200,\n    )\n    plt.stem(\n        freqs[peaksPos[filterPeaks]],\n        peaksHeight[filterPeaks],\n        bottom=np.min(spectrum_dB[plotInd]),\n        basefmt=\" \",\n    )\n    print(freqs[peaksPos[filterPeaks]])\nplt.ylabel(\"10log10(|X(F)|^2)\")\nplt.xlabel(\"F[Hz]\")\nplt.show()\n", "stft_harm.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 25\nF_s = 25\n\nx = np.sin(2 * np.pi * 0.1 * np.arange(N))\n\nfreq_x = np.fft.fftshift(\n    np.fft.fftfreq(x.size) * F_s\n)\nX = np.fft.fftshift(np.fft.fft(x))\n\nx_zp = np.pad(x, (0, 10 * N))\n\nfreq_x_zp = np.fft.fftshift(\n    np.fft.fftfreq(x_zp.size) * F_s\n)\nX_zp = np.fft.fftshift(np.fft.fft(x_zp))\n\nplt.plot(\n    freq_x, np.abs(X), color=\"b\", label=\"no zp\"\n)\nplt.plot(\n    freq_x_zp + 0.1,\n    np.abs(X_zp),\n    color=\"r\",\n    label=\"zp11\",\n)\nplt.xlabel(\"F [Hz]\")\nplt.ylabel(\"|X[]|\")\nplt.legend()\nplt.show()\n", "stft_length.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef f(t):\n    if t < 5:\n        return np.cos(2 * np.pi * t * 10)\n    elif t < 10:\n        return np.cos(2 * np.pi * t * 25)\n    elif t < 15:\n        return np.cos(2 * np.pi * t * 50)\n    else:\n        return np.cos(2 * np.pi * t * 100)\n\n\nF_s = 400.0  # Hz\nT_max = 20.0  # s\nT = np.linspace(0, T_max, int(T_max * F_s))  # s\n\nW = 2.0  # s\nW_N = int(F_s * W)  # samples\n\nx = np.array([f(tt) for tt in T])\nX = x.reshape((-1, W_N)).T\n\nF = np.fft.fftshift(np.fft.fftfreq(1024)) * F_s\n\nSTFT = np.fft.fftshift(\n    np.fft.fft(X, n=1024, axis=0), axes=0\n)\n\nplt.imshow(\n    np.abs(STFT),\n    extent=[T[0], T[-1], F[0], F[-1]],\n    cmap=\"bone\",\n)\nax = plt.gca()\nax.set_xlim(T[0], T[-1])\nax.set_ylim(F[-1], F[0])\nplt.ylabel(\"F [Hz]\")\nplt.xlabel(\"t [s]\")\nplt.colorbar()\nplt.gca().set_aspect(\"auto\")\nplt.show()\n", "stft_win.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.signal.windows import hann\n\nN = 25\nF_s = 25\n\nx = np.sin(\n    2 * np.pi * 0.1 * np.arange(N)\n) + 0.05 * np.sin(2 * np.pi * 0.2 * np.arange(N))\n\nx_1 = np.pad(x, (0, 10 * N))\n\nfreq_x = np.fft.fftshift(\n    np.fft.fftfreq(x_1.size) * F_s\n)\nX_1 = np.fft.fftshift(np.fft.fft(x_1))\n\nx_2 = np.pad(\n    x * hann(x.size, sym=False), (0, 10 * N)\n)\nX_2 = np.fft.fftshift(np.fft.fft(x_2))\n\nplt.semilogy(\n    freq_x,\n    np.abs(X_1),\n    color=\"r\",\n    label=\"rect\",\n)\nplt.semilogy(\n    freq_x,\n    np.abs(X_2),\n    color=\"b\",\n    label=\"hann\",\n)\n[\n    plt.axvline(xx)\n    for xx in [\n        0.1 * F_s,\n        0.2 * F_s,\n        -0.1 * F_s,\n        -0.2 * F_s,\n    ]\n]\nplt.xlabel(\"F [Hz]\")\nplt.ylabel(\"|X[]|\")\nplt.legend()\nplt.show()\n", "stft_zp.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nN = 25\nF_s = 25\n\nx = np.zeros(N)\nx[: N // 5] = 1\n\nfreq_x = np.fft.fftshift(\n    np.fft.fftfreq(x.size) * F_s\n)\nX = np.fft.fftshift(np.fft.fft(x))\n\nx_zp = np.pad(x, (0, 2 * N))\n\nfreq_x_zp = np.fft.fftshift(\n    np.fft.fftfreq(x_zp.size) * F_s\n)\nX_zp = np.fft.fftshift(np.fft.fft(x_zp))\n\nplt.stem(freq_x, np.abs(X), linefmt=\"b\")\nplt.stem(\n    freq_x_zp + 0.1, np.abs(X_zp), linefmt=\"r\"\n)\nplt.show()\n", "random/discrete.py": "import numpy as np\nimport matplotlib.pyplot as plt\n\nD = np.array([-1, 2, 3, 1, 0.1, np.pi])\np = np.array([1, 2, 2, 3, 6, 9])\np = p / np.sum(p)  # so that sum(p) = 1\n\n\ndef pdf(x):\n    where = D <= x\n    return np.sum(p[where])\n\n\nx = np.linspace(-2, +4, 1000)\n\nplt.stem(D, p)\nplt.plot(x, [pdf(xx) for xx in x], color=\"r\")\nplt.xlim(x.min(), x.max())\n\nplt.savefig(\"discrete.png\")\nplt.show()\n", "random/normal1.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.stats import norm\n\nx = np.linspace(-2, +4, 500)\n\nplt.figure()\nplt.plot(x, norm.pdf(x))\nplt.plot(x, norm.pdf(x, loc=2, scale=0.4))\nplt.plot(x, norm.pdf((x-2)/(0.4))/(0.4), linestyle=\"-.\")\n\nplt.savefig(\"normal1.png\")", "random/paramest1.py": "import matplotlib.pyplot as plt\n\nimport numpy as np\n\nfrom scipy.stats import expon\n\n\ndef monteCarlo():\n    data = expon.rvs(0, 4, 100)\n\n    loc, scale = expon.fit(data)\n\n    return np.std(data), scale\n\n\nplt.figure()\nsizes = [10, 50, 100, 500, 1000, 5000, 10000, 50000]\ntrials = np.mean(\n    [\n        (\n            np.array(\n                [\n                    np.mean(np.array([monteCarlo() for ii in range(nn)]), axis=0)\n                    for nn in sizes\n                ]\n            )\n            - 4\n        )\n        ** 2\n        for tt in range(50)\n    ],\n    axis=0,\n)\nprint(trials.shape)\nplt.subplot(121)\nplt.loglog(sizes, trials[:, 0], label=\"mean\")\nplt.loglog(sizes, trials[:, 1], label=\"ML\")\nplt.ylabel(\"bias^2 [log]\")\nplt.legend()\n\ntrials = np.array([monteCarlo() for ii in range(1000)])\nplt.subplot(122)\nplt.hist(trials[:, 0], bins=20, label=\"mean\")\nplt.hist(trials[:, 1], bins=20, label=\"ML\")\nplt.axvline(4, color=\"r\", label=\"true\")\nplt.axvline(np.mean(trials[:, 0]), color=\"b\", label=\"mean\")\nplt.axvline(np.mean(trials[:, 1]), color=\"g\", label=\"ML\")\nplt.legend()\nplt.savefig(\"paramest1.png\")\n", "random/paramest2.py": "import numpy as np\nfrom scipy.optimize import minimize\nfrom scipy.stats import crystalball, norm\nimport matplotlib.pyplot as plt\n\n\ndef log_likelihood(mean, variance, values):\n    return (\n        np.sum((values - mean) ** 2 / variance)\n        + np.log(2 * np.pi * variance) * values.size\n    )\n\n\ndef log_likelihood_jacobian(mean, variance, values):\n    return np.array(\n        [\n            -np.sum(values - mean) / variance,\n            values.size / variance - np.sum((values - mean) ** 2) / variance**2,\n        ]\n    )\n\n\ndef fit_parameters(values):\n    def objective(x):\n        mean = x[0]\n        variance = x[1]\n        return log_likelihood(mean, variance, values)\n\n    def jacobian(x):\n        mean = x[0]\n        variance = x[1]\n        return log_likelihood_jacobian(mean, variance, values)\n\n    return minimize(\n        objective, np.array([np.mean(values), np.var(values)]), jac=jacobian\n    ).x\n\n\nnum_samples = 10000\nx = crystalball.rvs(beta=2.0, m=2.3, loc=3, scale=2, size=num_samples)\n\nmean_hat, var_hat = fit_parameters(x)\nbeta_hathat, m_hathat, mean_hathat, var_hathat = crystalball.fit(x)\n\nprint(mean_hat, var_hat)\n\nplt_x = np.linspace(np.min(x), np.max(x), 50)\n\nplt.figure()\nplt.hist(x, bins=20, density=True, log=True, label=\"data\")\nplt.s nfrom scipy.stats import ecdf\n\n\ndef X(t):\n    return (\n        0.2\n        * np.sin(\n            2 * np.pi * 0.75 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + np.sin(\n            2 * np.pi * 1.5 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + 0.3 * np.random.randn(t.size)\n    )\n\n\nN = 10000\nF_s = 16  # sampling freq\nN_s = 64  # sample duration\nT = np.linspace(\n    0, N_s / F_s, N_s, endpoint=False\n)\n# quantisation level both in pos and neg\nnumLevels = 2\ndeltaQ = 1.5 / numLevels\n\nX15 = np.array([X(T) for nn in range(3)])\nXN = np.array([X(T) for nn in range(N)])\n\n\ndef quantize(x, deltaQ, levels):\n    q = np.round(x / deltaQ) * deltaQ\n    q[q < (-levels - 0.5) * deltaQ] = (\n        -levels * deltaQ\n    )\n    q[q > (levels + 0.5) * deltaQ] = (\n        levels * deltaQ\n    )\n    centers = np.linspace(\n        -levels * deltaQ,\n        +levels * deltaQ,\n        2 * levels + 1,\n        endpoint=True,\n    )\n    edges = np.concatenate(\n        [\n            centers - deltaQ / 2,\n            [centers[-1] + deltaQ / 2],\n        ]\n    )\n    return q, centers, edges\n\n\ndef empirical_pdf(x, edges):\n    density_eval = np.linspace(\n        edges[0], edges[-1]\n    )\n    # |\\Cref{eq:random:cdf}|\n    x_ecdf = ecdf(XN.flatten()).cdf\n\n    # |\\Cref{eq:random:pdf_approx}|\n    x_epdf = (\n        np.diff(x_ecdf.evaluate(density_eval))\n        / np.diff(density_eval)[0]\n    )\n\n    return x_epdf, density_eval\n\n\n# |\\Cref{eq:random:area_sampling}|\ndef density_area_sampling(t, x, deltaQ):\n    x_ecdf = ecdf(x.flatten()).cdf\n\n    # |\\Cref{eq:random:conv_cdf}|\n    return (\n        x_ecdf.evaluate(t + deltaQ / 2)\n        - x_ecdf.evaluate(t - deltaQ / 2)\n    ) / deltaQ\n\n\nX15_q, centers, edges = quantize(\n    X15, deltaQ, numLevels\n)\nXN_f, density_eval = empirical_pdf(\n    XN.flatten(), edges\n)\nXN_q, _, _ = quantize(XN, deltaQ, numLevels)\nXN_f_q, _ = np.histogram(\n    XN_q, edges, density=True\n)\nXN_f_q_as = [\n    density_area_sampling(\n        cc, XN.flatten(), deltaQ\n    )\n    for cc in centers\n]\n\n\nplt.figure(figsize=[6.4, 6.4], layout=\"tight\")\nplt.subplot(211)\n[\n    plt.axhline(cc, color=\"grey\", linestyle=\":\")\n    for cc in centers\n]\n[plt.axhline(ee, color=\"grey\") for ee in edges]\n\n[plt.plot(T, xx, color=\"blue\") for xx in X15]\n[plt.plot(T, xx, color=\"red\") for xx in X15_q]\n\nplt.subplot(212)\nplt.plot(\n    density_eval[:-1],\n    XN_f,\n    color=\"b\",\n    label=\"$f_X$\",\n)\nplt.stem(\n    centers - deltaQ / 50,\n    XN_f_q,\n    markerfmt=\"r\",\n    basefmt=\"r\",\n    linefmt=\"r\",\n    label=\"$f_{q(X)}$\",\n)\nplt.stem(\n    centers + deltaQ / 50,\n    XN_f_q_as,\n    markerfmt=\"g\",\n    basefmt=\"g\",\n    linefmt=\"g\",\n    label=\"$(rect_{\\\\Delta Q} * f_X) \\\\cdot c$\",\n)\n[\n    plt.axvline(ee, color=\"grey\", linestyle=\":\")\n    for ee in edges\n]\nplt.legend()\nplt.savefig(\"quantization2.png\")\n", "random/quantization3.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.stats import ecdf\nfrom scipy.special import sinc\nfrom scipy.differentiate import derivative\n\n\ndef X(t):\n    return (\n        0.2\n        * np.sin(\n            2 * np.pi * 0.75 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + np.sin(\n            2 * np.pi * 1.5 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + 0.3 * np.random.randn(t.size)\n    )\n\n\nN = 10000\nF_s = 16  # sampling freq\nN_s = 64  # sample duration\nT = np.linspace(\n    0, N_s / F_s, N_s, endpoint=False\n)\n# quantisation level both in pos and neg\nnumLevels = 7\ndeltaQ = 3.0 / numLevels\n\nXN = np.array([X(T) for nn in range(N)])\n\n\ndef quantize(x, deltaQ, levels):\n    q = np.round(x / deltaQ) * deltaQ\n    q[q < (-levels - 0.5) * deltaQ] = (\n        -levels * deltaQ\n    )\n    q[q > (levels + 0.5) * deltaQ] = (\n        levels * deltaQ\n    )\n    centers = np.linspace(\n        -levels * deltaQ,\n        +levels * deltaQ,\n        2 * levels + 1,\n        endpoint=True,\n    )\n    edges = np.concatenate(\n        [\n            centers - deltaQ / 2,\n            [centers[-1] + deltaQ / 2],\n        ]\n    )\n    return q, centers, edges\n\n\ndef empirical_pdf(x, edges):\n    density_eval = np.linspace(\n        edges[0],\n        edges[-1],\n        int(20 * (edges[-1] - edges[0])),\n    )\n    # |\\Cref{eq:random:cdf}|\n    x_ecdf = ecdf(x.flatten()).cdf\n\n    # |\\Cref{eq:random:pdf_approx}|\n    x_ecfd_vals = x_ecdf.evaluate(density_eval)\n\n    # numerical differentiation\n    x_epdf = (\n        0.5\n        * (x_ecfd_vals[2:] - x_ecfd_vals[:-2])\n        / np.diff(density_eval)[0]\n    )\n\n    return x_epdf, density_eval[1:]\n\n\ndef lin_extrplt(x, n: tuple[int]):\n    diff = np.diff(x)[[0, -1]]\n    return np.concatenate(\n        [\n            x[0]\n            - np.arange(1, n[0] + 1)[::-1]\n            * diff[0],\n            x,\n            x[-1]\n            + np.arange(1, n[1] + 1) * diff[1],\n        ]\n    )\n\n\ndef sinc_deriv(x):\n    return np.where(\n        np.isclose(x, 0),\n        np.zeros_like(x),\n        ((np.cos(np.pi * x) - sinc(x)) / x),\n    )\n\n\ndef invert_quant(X_f_q, evalGrid, centers):\n    sinc_shift = np.diff(centers)[0]\n    X_f_q_sum = np.cumsum(X_f_q)\n\n    # periodifizierung vermeided ringing\n    padded_centers = lin_extrplt(\n        centers, (0, X_f_q_sum.size)\n    )\n    X_f_q_sum = np.concatenate(\n        [X_f_q_sum, X_f_q_sum[::-1]]\n    )\n\n    return sinc_deriv(\n        np.add.outer(\n            evalGrid,\n            -padded_centers - sinc_shift / 2,\n        )\n        / sinc_shift\n    ).dot(X_f_q_sum)\n\n\nXN_q, centers, edges = quantize(\n    XN, deltaQ, numLevels\n)\nXN_f, density_eval = empirical_pdf(\n    XN.flatten(), edges\n)\nXN_f_q, _ = np.histogram(\n    XN_q, edges, density=True\n)\n\nXN_f_ipol = invert_quant(\n    XN_f_q, density_eval, centers\n)\n\nplt.figure(layout=\"tight\")\n\nplt.plot(\n    density_eval[:-1],\n    XN_f,\n    color=\"b\",\n    label=\"$f_X$\",\n)\nplt.stem(\n    centers,\n    XN_f_q,\n    markerfmt=\"r\",\n    basefmt=\"r\",\n    linefmt=\"r\",\n    label=\"$f_{q(X)}$\",\n)\n\nplt.plot(\n    density_eval,\n    XN_f_ipol,\n    color=\"g\",\n    label=\"estimate of $f_X$\",\n)\n[\n    plt.axvline(ee, color=\"grey\", linestyle=\":\")\n    for ee in edges\n]\nplt.legend()\n\nplt.savefig(\"quantization3.png\")\n", "random/quantization3_extrapolation.py": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.stats import ecdf\nfrom scipy.special import sinc\n#from scipy.differentiate import derivative\n\n\ndef X(t):\n    return (\n        0.2\n        * np.sin(\n            2 * np.pi * 0.75 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + np.sin(\n            2 * np.pi * 1.5 * t\n            + np.random.uniform(0, 2 * np.pi, 1)\n        )\n        + 0.3 * np.random.randn(t.size)\n    )\n\n\nN = 10000\nF_s = 16  # sampling freq\nN_s = 64  # sample duration\nT = np.linspace(\n    0, N_s / F_s, N_s, endpoint=False\n)\n# quantisation level both in pos and neg\nnumLevels = 7\ndeltaQ = 3.0 / numLevels\n\nXN = np.array([X(T) for nn in range(N)])\n\n\ndef quantize(x, deltaQ, levels):\n    q = np.round(x / deltaQ) * deltaQ\n    q[q < (-levels - 0.5) * deltaQ] = (\n        -levels * deltaQ\n    )\n    q[q > (levels + 0.5) * deltaQ] = (\n        levels * deltaQ\n    )\n    centers = np.linspace(\n        -levels * deltaQ,\n        +levels * deltaQ,\n        2 * levels + 1,\n        endpoint=True,\n    )\n    edges = np.concatenate(\n        [\n            centers - deltaQ / 2,\n            [centers[-1] + deltaQ / 2],\n        ]\n    )\n    return q, centers, edges\n\n\ndef empirical_pdf(x, edges):\n    density_eval = np.linspace(\n        edges[0],\n        edges[-1],\n        int(20 * (edges[-1] - edges[0])),\n    )\n    # |\\Cref{eq:random:cdf     // Format error safely without [object Object]
    function formatError(err) {
      if (!err) return "Unbekannter Fehler";
      if (typeof err === "string") return err;
      if (err.message) return err.message;
      if (err.stack) return err.stack;
      try {
        return JSON.stringify(err);
      } catch (e) {
        return String(err);
      }
    }

    // Safely create nested directories in Pyodide FS
    function ensureDirectory(fs, dirPath) {
      const parts = dirPath.split("/").filter(p => p.length > 0);
      let curr = dirPath.startsWith("/") ? "/" : "";
      for (const p of parts) {
        curr = curr === "/" ? ("/" + p) : (curr ? (curr + "/" + p) : p);
        try {
          fs.mkdir(curr);
        } catch (e) {
          // Directory already exists, ignore
        }
      }
    }

    // Initialize CodeMirror
    function initEditor() {
      editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        mode: "python",
        theme: "dracula",
        lineNumbers: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4,
        lineWrapping: true
      });

      // Shortcut: Ctrl + Enter / Cmd + Enter to Run
      editor.setOption("extraKeys", {
        "Ctrl-Enter": () => runCode(),
        "Cmd-Enter": () => runCode()
      });
    }

    function setStatus(state, msg) {
      statusDot.className = "status-dot" + (state ? " " + state : "");
      statusText.textContent = msg;
      btnRun.disabled = (state === "running");
      const isRunning = state === "running";
      runIndicator.classList.toggle("is-running", isRunning);
      runIndicator.setAttribute("aria-hidden", String(!isRunning));
    }

    // Terminal Output
    function clearTerminal() {
      terminalContainer.innerHTML = "";
    }

    function appendTerminal(text, type = "") {
      const span = document.createElement("span");
      span.className = type;
      span.textContent = text;
      terminalContainer.appendChild(span);
      terminalContainer.scrollTop = terminalContainer.scrollHeight;

        setStatus("", "Lade NumPy, SciPy & Matplotlib...");
        await pyodideInstance.loadPackage(["numpy", "scipy", "matplotlib"]);

        // Preload all 44 course scripts into Pyodide virtual filesystem
        for (const [relPath, code] of Object.entries(EMBEDDED_SCRIPTS)) {
          try {
            const parts = relPath.split("/");
            if (parts.length > 1) {
              const dir = parts.slice(0, -1).join("/");
              ensureDirectory(pyodideInstance.FS, dir);
            }
            pyodideInstance.FS.writeFile(relPath, code);
            // Also write flat in root for simple imports (e.g. from radar1 import gen_receive)
            if (parts.length > 1) {

          } catch (fileErr) {

          }
        }

        // course scripts' existing ../data path relative to Pyodide's CWD.
        const dataDirectories = ["/data", "../data"];
        for (const dataDirectory of dataDirectories) {
          ensureDirectory(pyodideInstance.FS, dataDirectory);
        }
        for (const [fileName, encodedData] of Object.entries(EMBEDDED_DATA_FILES)) {
          try {
            const binary = atob(encodedData);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            for (const dataDirectory of dataDirectories) {

# Setup dedicated execution harness to ensure clean isolation
_dsv_harness = types.ModuleType('_dsv_harness')
sys.modules['_dsv_harness'] = _dsv_harness

_harness_code = '''
import sys

# Patch matplotlib_pyodide destroy to prevent null parentNode errors
try:
    import matplotlib_pyodide.browser_backend
    def _safe_destroy(self, *args, **kwargs):
        try:
            div = self.get_element("")
            if div is not None:
                parent = div.parentNode
                if parent is not None:
                    parent.removeChild(div)
        except Exception:
            pass
    matplotlib_pyodide.browser_backend.FigureCanvasWasm.destroy = _safe_destroy
except Exception:
    pass

def reset_environment():
    # 1. Close and wipe all matplotlib figures completely
    try:
        import matplotlib.pyplot as plt
        plt.close('all')
    except Exception:
        pass
    try:
        import matplotlib._pylab_helpers
        matplotlib._pylab_helpers.Gcf.figs.clear()
    except Exception:
        pass

    # 2. Reset cached course modules so edits in the editor take effect
    for mod in ['radar1', 'mlbs']:
        sys.modules.pop(mod, None)

    # 3. Wipe all user-defined globals from __main__
    main_dict = sys.modules['__main__'].__dict__
    keep_keys = {'__name__', '__doc__', '__package__', '__loader__', '__spec__', '__builtins__'}
    for key in list(main_dict.keys()):
        if key not in keep_keys:
            del main_dict[key]

def finish_execution():
    # Show any figures that were created but not yet shown (e.g. scripts using plt.savefig)
    try:
        import matplotlib.pyplot as plt
        for num in list(plt.get_fignums()):
            fig = plt.figure(num)
            fig.canvas.show()
    except Exception:

    reset_environment()
    main_dict = sys.modules['__main__'].__dict__
    main_dict['__file__'] = filename
    compiled = compile(code_str, filename, 'exec')
    exec(compiled, main_dict, main_dict)
    finish_execution()
'''

      const script = e.target.value;
      const url = new URL(window.location.href);
      url.searchParams.set("script", script);
      window.history.pushState({}, "", url);
      await loadScript(script);
      if (pyodideInstance) {
        runCode();
      }
    });

    // Init on page load
    window.addEventListener("DOMContentLoaded", () => {
      initEditor();

      // Read URL query parameter
      const params = new URLSearchParams(window.location.search);
      const targetScript = params.get("script") || params.get("code") || "aliasing.py";

      loadScript(targetScript);
      initPyodideRuntime();
    });
  </script>
</body>
</html>
